name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q GameDeals-Android-Project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: GameDeals
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain -PRAWG_API_KEY="${{ secrets.RAWG_API_KEY }}" 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: GameDeals
        run: |
          grep -E -A6 "^e: |What went wrong|error:" build.log | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: GameDeals-apk
          path: GameDeals/app/build/outputs/apk/release/*.apk

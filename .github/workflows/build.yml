name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip project
        run: |
          f="$(git log -1 --name-only --format= --diff-filter=AM -- '*.zip' | head -1)"
          echo "Using: $f"
          test -n "$f"
          unzip -q -o "$f"
          ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and AAB
        working-directory: GameDeals
        env:
          KSPW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease --console=plain \
            -PKEYSTORE_FILE="$GITHUB_WORKSPACE/keystore.jks" \
            -PKEYSTORE_PASSWORD="$KSPW" \
            -PVERSION_CODE="${{ github.run_number }}" \
            -PRAWG_API_KEY="${{ secrets.RAWG_API_KEY }}" 2>&1 | tee build.log

      - name: Show errors
        if: failure()
        working-directory: GameDeals
        run: |
          grep -E -A6 "^e: |What went wrong|error:" build.log | head -60

      - uses: actions/upload-artifact@v4
        with:
          name: GameDeals-release
          path: |
            GameDeals/app/build/outputs/apk/release/*.apk
            GameDeals/app/build/outputs/bundle/release/*.aab
